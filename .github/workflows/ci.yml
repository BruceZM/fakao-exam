name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python modules
        run: python -m py_compile server/main.py tools/build_app_bundle.py tools/deploy_ms.py
      - name: Rebuild app bundle
        run: python tools/build_app_bundle.py --project-root .
      - name: Check bundle is tracked and non-empty
        run: python -c "import json; p='app/data/questions.json'; d=json.load(open(p, encoding='utf-8')); assert len(d) > 0"
